# Build & push images → dispatch orbit-infra (same pattern as SeptronOrbit/.github/workflows/build.yml).
#
# main → prod. Images: ghcr.io/septronr/universe-api:prod-<sha12>, ghcr.io/septronr/universe-web:prod-<sha12>.
# orbit-infra's deploy.yml receives the `deploy` dispatch (env "universe", gated by its `production` environment) and runs
# scripts/update.sh universe <api image> <web image> on the VPS → compose/apps/universe-prod.yml.
# guards.yml runs on every push by itself; it does not gate this workflow until the first release is live.

name: Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Database_Schema.sql'
      - 'docs/Feature_Flags.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/septronr/universe-api
  IMAGE_WEB: ghcr.io/septronr/universe-web

jobs:
  meta:
    name: Resolve tags
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      api_tag: ${{ steps.meta.outputs.api_tag }}
      web_tag: ${{ steps.meta.outputs.web_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          SHORT=$(git rev-parse --short=12 HEAD)
          echo "sha_tag=prod-${SHORT}"                >> "$GITHUB_OUTPUT"
          echo "api_tag=${IMAGE_API}:prod-${SHORT}"   >> "$GITHUB_OUTPUT"
          echo "web_tag=${IMAGE_WEB}:prod-${SHORT}"   >> "$GITHUB_OUTPUT"

  build-api:
    name: universe-api
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy repo-root files the image needs into the backend/ context
        # revision 0001 applies Database_Schema.sql; the feature registry reads docs/Feature_Flags.md
        run: |
          cp Database_Schema.sql backend/
          mkdir -p backend/docs
          cp docs/Feature_Flags.md backend/docs/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ needs.meta.outputs.api_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.meta.outputs.sha_tag }}
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.sha_tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    name: universe-web
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ needs.meta.outputs.web_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            MODE=production
            VITE_API_URL=/api/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  dispatch:
    name: Trigger infra deploy
    needs: [meta, build-api, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: septronr/orbit-infra
          event-type: deploy
          client-payload: '{"env": "universe", "image": "${{ needs.meta.outputs.api_tag }}", "web_image": "${{ needs.meta.outputs.web_tag }}"}'
