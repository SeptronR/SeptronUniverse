# SeptronUniverse — single-host reverse proxy (dev via docker-compose.yml; the same shape serves single-host
# production behind TLS termination). Multi-host production uses Traefik labels in orbit-infra instead.
# Spec: Prompts/00_PREREQUISITE_Project_Setup.md §3.27 and Prompts/44_Phase44_Deployment_CICD_Operations.md 44.6 (docker & compose, 4).

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:5173;      # Vite dev server; production image serves dist/ from the `web` service (Phase 44)
}

# The SSR public-site service (Phase 40, `frontend/Dockerfile.ssr`) — only present from Phase 40 onward.
# Until then /site/ falls through to the `backend` upstream (404). Phase 40 changes the default to `ssr:5175`;
# the Docker embedded DNS resolver below lets nginx resolve that name at runtime.
map $host $ssr_upstream {
    default backend;
}
resolver 127.0.0.11 valid=30s ipv6=off;

# WebSocket upgrade helper
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost universe.septronr.com *.universe.septronr.com;

    # Uploads (student photos, documents, bulk PDFs) go through signed URLs; 25M matches the API's upload limit
    client_max_body_size 25M;
    client_body_buffer_size 1M;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;

    # Security headers (CSP with nonces is emitted by the backend / SSR gateway per Phase 43; keep the static ones here)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(self)" always;
    add_header X-Request-Id $request_id always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Tenant resolution: the backend's InstitutionContextMiddleware maps the host (custom domain or <slug>.universe.…)
    # to the institution; the SPA also sends X-Institution-Slug explicitly (axios interceptor), which wins when present.
    proxy_set_header X-Institution-Slug $host;
    proxy_read_timeout 60s;          # API statement timeout is 30 s; reports/exports run as background jobs
    proxy_connect_timeout 5s;

    # ---- API ------------------------------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Connection "";
    }

    # Infra endpoints (public, no envelope). /metrics is bearer-protected by the app and must not be exposed
    # on the public edge in production (network ACL / Traefik middleware) — allowed here for local scraping only.
    location = /health  { proxy_pass http://backend; access_log off; }
    location = /ready   { proxy_pass http://backend; access_log off; }
    location = /metrics { proxy_pass http://backend; allow 127.0.0.1; allow 172.16.0.0/12; allow 10.0.0.0/8; deny all; }

    # ---- WebSocket hub (notifications, job tray, live dashboards) ------------------------------------------
    location /ws/ {
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- Uploads: every file link is HMAC-signed (/uploads/{key}?sig=&exp=); the API verifies signature + expiry
    # and streams the file (local backend) or redirects to a presigned S3 URL, so this location proxies — the volume is
    # never exposed directly (Phase 01 file service).
    location /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # ---- Public site (SSR, Phase 40): /site/<slug>/* and custom domains; sitemap/robots/verify/status ----
    location /site/ {
        proxy_pass http://$ssr_upstream;
        proxy_cache_bypass $arg_preview;
    }
    location = /sitemap.xml { proxy_pass http://$ssr_upstream; }
    location = /robots.txt  { proxy_pass http://$ssr_upstream; }
    location /verify/       { proxy_pass http://backend; }     # Phase 26/40 document verification landing (public)

    # FastAPI docs / OpenAPI (dev only — Phase 44 disables /docs in production via APP_ENV)
    location /docs         { proxy_pass http://backend; }
    location /redoc        { proxy_pass http://backend; }
    location /openapi.json { proxy_pass http://backend; }

    # ---- Web app (Vite dev server with HMR; production: static dist with SPA fallback) ----------------------
    location / {
        proxy_pass http://frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
