name: septron_universe
description: SeptronUniverse mobile app (Flutter) - role shells, offline-first, visibility-aware screens.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

# Prompts/00_PREREQUISITE_Project_Setup.md §5 - Phase 42 completes the app; Phase 00 ships the compiling core skeleton.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ">=2.4.6 <4.0.0"  # Phase 42 — offline cache + write queue (raw SQL, no codegen)
  path_provider: ^2.1.3
  path: ^1.9.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.2
  local_auth: ^2.3.0
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0
  intl: any
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  open_filex: ^4.4.0
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.0
  web_socket_channel: ^3.0.1
  sentry_flutter: ^8.5.0
  razorpay_flutter: ^1.3.7
  connectivity_plus: ^6.0.5
  uuid: ^4.4.2
  geolocator: ^13.0.1  # Phase 06 — geo-fenced staff self check-in (attendance.geo_app)
  image_picker: ^1.1.2  # Phase 07 — student photo + credit-transfer certificate capture

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/theme/tokens.json
