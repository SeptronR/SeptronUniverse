# pgBackRest (Prompts/44 §44.6 backup_dr 1): S3-compatible repository, client-side AES-256 encryption, 30 daily
# (diff/incr chain within weekly fulls) and 12 monthly retention; secrets from the environment (PGBACKREST_REPO1_*).
[global]
repo1-type=s3
repo1-s3-bucket=universe-backups
repo1-s3-region=ap-south-1
repo1-s3-endpoint=s3.ap-south-1.amazonaws.com
repo1-path=/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=5
repo1-retention-full-type=count
repo1-retention-archive=30
repo1-bundle=y
process-max=4
compress-type=zst
start-fast=y
log-level-console=info

[universe]
pg1-path=/var/lib/postgresql/data
