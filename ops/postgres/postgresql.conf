# PostgreSQL tuning for the §17 reference host (8 vCPU / 16 GB) — Prompts/44 §44.6 docker 3 / performance tuning.
listen_addresses = '*'
max_connections = 300
shared_buffers = 4GB
effective_cache_size = 10GB
work_mem = 32MB
maintenance_work_mem = 512MB
wal_level = replica
max_wal_size = 4GB
archive_mode = on
archive_command = 'pgbackrest --stanza=universe archive-push %p'
archive_timeout = 300
checkpoint_completion_target = 0.9
random_page_cost = 1.1
log_min_duration_statement = 500ms
log_line_prefix = '%m [%p] %q%u@%d '
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
statement_timeout = 0          # per role: universe_app 30s (API), reports run on a role/session with 10min
idle_in_transaction_session_timeout = 60s
