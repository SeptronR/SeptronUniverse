# promtail → Loki (Prompts/44 §44.6 observability 4). Container JSON logs (structlog, PII-redacted at source by the
# Phase 43 processor); request_id / institution_id / user_id / job_id become labels-free fields for LogQL.
server: { http_listen_port: 9080 }
positions: { filename: /tmp/positions.yaml }
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs: [{ host: unix:///var/run/docker.sock, refresh_interval: 15s }]
    relabel_configs:
      - { source_labels: ["__meta_docker_container_label_com_docker_compose_service"], target_label: service }
    pipeline_stages:
      - json: { expressions: { level: level, request_id: request_id, institution_id: institution_id } }
      - labels: { level: "" }
